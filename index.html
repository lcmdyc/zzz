<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打卡</title>
<link rel="stylesheet" href="style.css?v=3">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<div id="toast"><span id="tmsg"></span><button id="tundo">撤销</button></div>
<div id="modal"><div class="box" id="mbox"></div></div>

<div class="wrap">
  <h1>📋 打卡</h1>
  <p class="sub" id="today"></p>
  <div class="tabs" id="tabs"></div>

  <div class="card" id="remcard">
    <h2>💊 到期提醒</h2>
    <div id="rem"></div>
  </div>

  <div id="timers"></div>

  <div class="card">
    <h2>今日（点卡片可手动记录）</h2>
    <div class="cards" id="cards"></div>
    <div class="row" style="justify-content:flex-start"><button class="g s" id="backfill">⏱ 补录（忘扫或补记过去的事）</button></div>
  </div>

  <div id="states"></div>

  <div class="card">
    <div class="nav">
      <button class="g s" id="prev">◀ 上一周</button>
      <b id="wlabel"></b>
      <button class="g s" id="next">下一周 ▶</button>
    </div>
    <div class="scroll"><table id="week"></table></div>
    <p class="tip">计时项按自然日 0 点切分。间隔颜色按你在编辑器里设置的阈值：🟢短、🟡中、🔴长。</p>
  </div>

  <div class="card">
    <div class="nav">
      <h2 style="margin:0">📈 趋势图表</h2>
      <select id="range" style="border:1px solid #ddd;border-radius:8px;padding:4px">
        <option value="14">近14天</option><option value="30" selected>近30天</option><option value="90">近90天</option>
      </select>
    </div>
    <p class="tip" id="chartMsg"></p>
    <div id="chartHost"></div>
  </div>

  <div class="card noprint">
    <h2>📄 周报 / 月报</h2>
    <div class="row" style="justify-content:flex-start;flex-wrap:wrap;align-items:center">
      <button id="rw0">本周周报</button>
      <button id="rw1" class="g">上周周报</button>
      <input type="month" id="rmonth" style="border:1px solid #ddd;border-radius:8px;padding:6px">
      <button id="rm">生成月报</button>
    </div>
    <p class="tip">报告只统计当前档案。已结束的月份可在下载后选择删除原始数据，释放云端空间（非必须）。</p>
  </div>

  <div class="card">
    <h2>最近记录</h2>
    <div class="log" id="log"></div>
  </div>

  <div class="card noprint">
    <details>
      <summary>🏷️ NFC 贴片链接（写入贴片用）</summary>
      <p class="tip" style="margin-bottom:6px">发布到 GitHub Pages 后复制到的才是正式地址。计时项推荐用「切换」一张贴片。所有档案的链接都在这里。</p>
      <div id="urls"></div>
    </details>
    <details style="margin-top:10px">
      <summary>☁️ 云同步（Supabase）</summary>
      <div style="display:grid;gap:6px">
        <input id="sbUrl" placeholder="Project URL，如 https://xxxx.supabase.co" style="border:1px solid #ddd;border-radius:8px;padding:8px">
        <input id="sbKey" placeholder="anon public key" style="border:1px solid #ddd;border-radius:8px;padding:8px">
        <input id="sbEmail" placeholder="登录邮箱" type="email" style="border:1px solid #ddd;border-radius:8px;padding:8px">
        <input id="sbPw" placeholder="密码" type="password" style="border:1px solid #ddd;border-radius:8px;padding:8px">
      </div>
      <div class="row" style="justify-content:flex-start;flex-wrap:wrap">
        <button id="sbLogin">登录并同步</button>
        <button class="g" id="sbSync">立即同步</button>
        <button class="g" id="sbOut">退出登录</button>
      </div>
      <p class="tip" id="sbStat">未登录</p>
    </details>
    <details style="margin-top:10px">
      <summary>💾 数据备份</summary>
      <div class="row" style="justify-content:flex-start;flex-wrap:wrap">
        <button id="expCsv">导出 CSV</button>
        <button id="expJson">导出备份 JSON</button>
        <button class="g" id="impBtn">导入备份</button>
        <input type="file" id="impFile" accept=".json" style="display:none">
      </div>
      <p class="tip">未登录云同步时，数据只存在这台手机的浏览器里，建议每周导出一次。</p>
      <hr style="margin:12px 0;border:none;border-top:1px solid #eee">
      <button class="g s" id="clearAll">清空本机所有数据</button>
    </details>
  </div>
</div>

<!-- 加载顺序不能改 -->
<script src="js/config.js?v=2"></script>
<script src="js/profiles.js?v=2"></script>
<script src="js/core.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<script src="js/editor.js?v=2"></script>
<script src="js/charts.js?v=2"></script>
<script src="js/report.js?v=2"></script>
<script src="js/sync.js?v=2"></script>
<script src="js/main.js?v=2"></script>
</body>
</html>
